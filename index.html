<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>remo-apps</title>
<style>
  :root { color-scheme: light dark; --ink: #1a1c20; --muted: #5f6570; --line: #dfe2e7; --bg: #ffffff; --accent: #1D7FBF; }
  @media (prefers-color-scheme: dark) { :root { --ink: #eceef1; --muted: #9aa1ac; --line: #2a2e35; --bg: #111316; --accent: #6CB6E6; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif; line-height: 1.8; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 32px; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border-top: 1px solid var(--line); padding: 16px 0; }
  li:last-child { border-bottom: 1px solid var(--line); }
  a { color: var(--accent); }
  .app-name { font-size: 1.1rem; font-weight: 700; text-decoration: none; }
  .app-desc { color: var(--muted); font-size: 0.95rem; margin: 2px 0 0; }
</style>
</head>
<body>
<main>
  <h1>remo-apps</h1>
  <p class="lead">個人で開発しているアプリの情報ページです。</p>

  <h2>アプリ</h2>
  <ul>
    <li>
      <a class="app-name" href="postshelf/">PostShelf</a>
      <p class="app-desc">Xの投稿を保存・整理できるiOSアプリ</p>
    </li>
  </ul>
</main>
</body>
</html>
